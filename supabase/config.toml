project_id = "xoeat-partner"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["xoeat-partner://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false   # 가맹점 계정은 플랫폼이 발급한다. 데모 계정은 scripts/seed-demo.mjs 로 만든다.

[auth.email]
enable_signup = false
enable_confirmations = false
