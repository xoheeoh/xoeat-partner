project_id = "xoeat-partner"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["xoeat-partner://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true    # 구매자 앱 회원가입용. 사장님 계정은 scripts/seed-demo.mjs 가 서비스 롤로 만든다.

[auth.email]
enable_signup = true
enable_confirmations = false
